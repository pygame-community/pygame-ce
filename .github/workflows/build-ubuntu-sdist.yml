# this workflow tests sdist builds and also doubles as our minimum dependency
# check: it builds against the apt packages of the oldest maintained distro
# whose default python3 is our minimum supported python. The dependency
# versions in the README should match what this distro ships.
# See https://github.com/pygame-community/pygame-ce/issues/3794
# When our minimum python changes, update the container image below (this may
# be a debian or ubuntu image) and the README dependency versions together.
# the main difference between this and the manylinux builds is that this runs
# directly under the distro and uses apt installed dependencies, while the
# manylinux workflow runs with centos docker and self-compiled dependencies
# IMPORTANT: binaries are not to be uploaded from this workflow!

name: Minimum deps sdist

# Run CI only when a release is created, on changes to main branch, or any PR
# to main.
on:
  push:
    branches: [main, main-2.x]

  pull_request:
    branches: [main, main-2.x]

  # the github release drafter can call this workflow
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ubuntu-sdist
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false  # if a particular matrix build fails, don't skip the rest
      matrix:
        # Debian 12 ships python 3.11, our minimum python version
        image: ['debian:bookworm']

    env:
      # Pip now forces us to either make a venv or set this flag, so we will do
      # this
      PIP_BREAK_SYSTEM_PACKAGES: 1
      # We are using dependencies installed from apt
      PG_DEPS_FROM_SYSTEM: 1

    steps:
    # this runs before checkout, because checkout needs git to make a real repo
    # (and meson dist needs one to make the sdist). The container runs as root,
    # so no sudo here.
    - name: Install deps
      # install numpy from pip and not apt because the one from pip is newer,
      # and has typestubs
      run: |
        apt-get update --fix-missing
        apt-get install -y git build-essential pkg-config fontconfig
        apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev libportmidi-dev
        apt-get install -y python3-dev python3-pip python3-venv
        # the distro pip can't be upgraded in place (it isn't pip-managed),
        # so install a newer pip alongside it
        pip3 install --upgrade --ignore-installed pip
        pip3 install build numpy

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Make sdist and install it
      run: |
        python3 -m build --sdist --outdir dist .
        pip3 install dist/pygame_ce-*.tar.gz -vv

    - name: Run tests
      env:
        SDL_VIDEODRIVER: "dummy"
        SDL_AUDIODRIVER: "disk"
      run: python3 -m pygame.tests -v --exclude opengl,music,timing --time_out 300
      # github.workspace is the host path, not the container path, so use a
      # relative path here
      working-directory: ..

    - name: Test typestubs
      run: python3 dev.py stubs

    # We upload the generated files under github actions assets
    - name: Upload sdist
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pygame-wheels-sdist
        path: dist/*.tar.gz
        compression-level: 0  # already compressed, no need for more compression
